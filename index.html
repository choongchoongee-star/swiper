<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7c07a">
<meta name="description" content="스와이프로 넘겨보는 길고양이 한 마리의 일생. 오늘도 어떻게든, 골목의 하루가 넘어간다.">
<title>스와이프 캣 — 어느 길고양이의 일생</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 타이틀 -->
<section id="title" class="screen">
  <div id="title-inner" class="title-inner">
    <div id="title-cat" class="title-cat"></div>
    <h1>스와이프 캣</h1>
    <p class="sub">어느 길고양이의 일생</p>
    <p class="tag">오늘도 어떻게든, 골목의 하루가 넘어간다.</p>
    <button id="start" class="swipe-start">
      <span class="chev">︿</span>
      <span class="swipe-label">위로 스와이프해서 시작</span>
    </button>
    <p id="best" class="best"></p>
    <button id="dex" class="dex"></button>
    <div id="recent" class="recent"></div>
  </div>
</section>

<!-- 엔딩 도감 -->
<section id="dexview" class="screen" hidden>
  <h2 class="dex-title">엔딩 도감</h2>
  <p id="dex-count" class="dex-count"></p>
  <ul id="dex-list" class="dex-list"></ul>
  <div class="ending-actions">
    <button id="dex-share" class="btn btn--ghost">🔗 도감 공유하기</button>
    <button id="dex-back" class="btn btn--ghost">돌아가기</button>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="screen" hidden>
  <header class="hud">
    <div id="progress" class="progress">1 / 100</div>
    <div class="hud-right">
      <div class="score-wrap"><span id="score" class="score">0</span><small>점</small></div>
      <button id="mute" class="pause-btn" title="소리"></button>
      <button id="pause" class="pause-btn" title="처음 화면으로">⏸</button>
    </div>
  </header>
  <main class="stack">
    <div id="card" class="card"></div>
  </main>

  <div class="stats-row">
    <div id="stats" class="stats"></div>
    <button id="help" class="help-btn" title="성향이란?">?</button>
  </div>
  <div class="hint-row">
    <p id="hint" class="hint">위로 스와이프</p>
    <button id="auto" class="auto-btn" hidden></button>
  </div>

  <div id="helpsheet" class="helpsheet" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <div id="result" class="result"></div>
  <div id="stage-banner" class="stage-banner"></div>
  <div id="fx" class="fx" hidden></div>
  <div id="flash"></div>
</section>

<!-- 엔딩 -->
<section id="ending" class="screen" hidden>
  <div id="ending-body"></div>
  <div id="submit"></div>
  <div class="ending-actions">
    <button id="retry" class="btn">다시 태어나기</button>
    <button id="share-ending" class="btn btn--ghost">🔗 공유하기</button>
    <button id="to-title" class="btn btn--ghost">처음으로</button>
  </div>
</section>

<!-- 도감 완성 축하 씬 -->
<section id="dexdone" class="screen" hidden>
  <div class="dexdone-inner">
    <p class="share-from">📖 엔딩 도감 완성</p>
    <div id="dexdone-crowd" class="dexdone-crowd"></div>
    <h2 class="dexdone-title">감사합니다</h2>
    <p class="dexdone-sub">서른한 가지 삶을 전부 만나주셨습니다.<br>골목의 고양이들이 모두 모여 인사를 전합니다.</p>
    <div class="ending-actions">
      <button id="dexdone-share" class="btn">🔗 도감 자랑하기</button>
      <button id="dexdone-close" class="btn btn--ghost">계속</button>
    </div>
  </div>
</section>

<!-- 공유된 링크로 들어온 사람에게 보여주는 화면 -->
<section id="shareview" class="screen" hidden>
  <div id="share-body"></div>
  <button id="share-play" class="btn">🐾 나도 한 판 살아보기</button>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
